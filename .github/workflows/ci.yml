name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples scripts
      - run: pytest -q
      - name: Offline agent loop and stdio tool-server demos
        run: |
          python examples/plain_agent_loop.py
          python examples/mcp_client_demo.py
      - name: Mutation evidence requires a green baseline and real test failures
        run: python scripts/mutation_check.py
